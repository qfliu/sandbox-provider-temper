# Network isolation (D18, D37). Enforced by Calico (minikube --cni=calico).
# Applied by cluster-up.sh; verified by code/scripts/test-network-policy.sh.
#
# Sandboxes run untrusted code. They may reach the internet (pip, npm, git)
# and DNS, and nothing else: not each other, the platform (API, gateway,
# Postgres), the Kubernetes API, node IPs, or the cloud metadata endpoint.
# Only the API and the gateway may connect to a sandbox, and only on port 22.

# --- sandboxes namespace: deny everything not allowed below -----------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: sandboxes
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# Ingress: sshd, only from the platform's API and gateway pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ssh-from-platform
  namespace: sandboxes
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: sandbox-system}
      podSelector:
        matchExpressions:
        - {key: app, operator: In, values: [sandbox-api, sandbox-gateway]}
    ports:
    - {protocol: TCP, port: 22}
---
# Egress: DNS (cluster DNS only) and the public internet. Private and
# link-local ranges are excluded, which covers the pod and service networks,
# the nodes (and so the Kubernetes API), a cloud VPC, and the metadata
# endpoint 169.254.169.254, without knowing each cluster's exact CIDRs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dns-and-internet
  namespace: sandboxes
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
  - to:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: kube-system}
      podSelector:
        matchLabels: {k8s-app: kube-dns}
    ports:
    - {protocol: UDP, port: 53}
    - {protocol: TCP, port: 53}
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 10.0.0.0/8        # private (pods, services, typical VPCs)
        - 172.16.0.0/12     # private
        - 192.168.0.0/16    # private (minikube's node network)
        - 100.64.0.0/10     # carrier-grade NAT (some cloud VPCs)
        - 169.254.0.0/16    # link-local, incl. cloud metadata 169.254.169.254
        - 127.0.0.0/8       # loopback
---
# --- sandbox-system: Postgres only from the API and gateway (defence in depth)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-from-platform
  namespace: sandbox-system
spec:
  podSelector:
    matchLabels: {app: postgres}
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - {key: app, operator: In, values: [sandbox-api, sandbox-gateway]}
    ports:
    - {protocol: TCP, port: 5432}

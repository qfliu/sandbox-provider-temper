# Image pre-pull (D19, step 5.3): one small pod per node whose init
# containers use each sandbox image, so every node has them cached and a new
# sandbox never waits on an image download (they're 145-220 MB). The init
# containers just run `true`; the pod then idles on the tiny pause image.
#
# Keep the image list in step with sandbox.Images and SANDBOX_IMAGE_TAG.
# After publishing new image tags, `kubectl -n sandbox-system rollout
# restart daemonset/sandbox-image-prepull` makes every node fetch them.
# (On minikube the images are built on the node, so this is a no-op there;
# it matters on a real cluster with a registry and many nodes.)
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: sandbox-image-prepull
  namespace: sandbox-system
  labels: {app: sandbox-image-prepull}
spec:
  selector:
    matchLabels: {app: sandbox-image-prepull}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 100%}   # nothing serves traffic; update all nodes at once
  template:
    metadata:
      labels: {app: sandbox-image-prepull}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 1
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534        # nobody
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      initContainers:
      - name: ubuntu-base
        image: sandbox/ubuntu-base:0.1
        imagePullPolicy: IfNotPresent
        command: ["true"]
        securityContext: &locked
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        resources: &tiny
          requests: {cpu: 10m, memory: 16Mi}
          limits: {cpu: 100m, memory: 32Mi}
      - name: ubuntu-dev
        image: sandbox/ubuntu-dev:0.1
        imagePullPolicy: IfNotPresent
        command: ["true"]
        securityContext: *locked
        resources: *tiny
      containers:
      - name: pause
        image: registry.k8s.io/pause:3.10.2
        imagePullPolicy: IfNotPresent
        securityContext: *locked
        resources: *tiny

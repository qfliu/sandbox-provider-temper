# The SSH gateway inside the cluster (D6, D35). Applied by
# code/scripts/deploy-gateway.sh, which substitutes the image tag.
#
# Needs Secrets in sandbox-system: gateway-host-key, sandbox-internal-key-private
# (cluster-up.sh) and postgres-gateway-credentials (deploy-gateway.sh).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-gateway
  namespace: sandbox-system
automountServiceAccountToken: false   # the gateway needs no Kubernetes API access
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-gateway
  namespace: sandbox-system
spec:
  replicas: 2
  selector:
    matchLabels: {app: sandbox-gateway}
  template:
    metadata:
      labels: {app: sandbox-gateway}
    spec:
      serviceAccountName: sandbox-gateway
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: gateway
        image: sandbox/api:IMAGE_TAG
        imagePullPolicy: IfNotPresent
        command: ["/gateway"]
        ports:
        - {name: ssh, containerPort: 2222}
        env:
        - name: POSTGRES_PASSWORD
          valueFrom: {secretKeyRef: {name: postgres-gateway-credentials, key: password}}
        - name: DATABASE_URL     # narrow role: SELECT on sandboxes + UPDATE of last_activity_at only
          value: postgres://sandbox_gateway:$(POSTGRES_PASSWORD)@postgres.sandbox-system:5432/sandbox?sslmode=disable
        - {name: GATEWAY_LISTEN_ADDR, value: ":2222"}
        - {name: GATEWAY_HOST_KEY_FILE, value: /keys/host/ssh_host_ed25519_key}
        - {name: SANDBOX_INTERNAL_KEY_FILE, value: /keys/internal/id}
        readinessProbe:
          tcpSocket: {port: ssh}
          periodSeconds: 5
        livenessProbe:
          tcpSocket: {port: ssh}
          periodSeconds: 10
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits:   {cpu: "1", memory: 256Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        volumeMounts:
        - {name: host-key, mountPath: /keys/host, readOnly: true}
        - {name: internal-key, mountPath: /keys/internal, readOnly: true}
      volumes:
      - name: host-key
        secret: {secretName: gateway-host-key, defaultMode: 0440}
      - name: internal-key
        secret: {secretName: sandbox-internal-key-private, defaultMode: 0440}
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-gateway
  namespace: sandbox-system
spec:
  selector: {app: sandbox-gateway}
  ports:
  - {name: ssh, port: 22, targetPort: ssh}

# The SSH gateway inside the cluster (D6, D35). Applied by
# code/scripts/deploy-gateway.sh, which substitutes the image tag.
#
# Needs Secrets in sandbox-system: gateway-host-key, sandbox-internal-key-private
# (cluster-up.sh) and postgres-gateway-credentials (deploy-gateway.sh).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-gateway
  namespace: sandbox-system
automountServiceAccountToken: false   # the gateway needs no Kubernetes API access
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-gateway
  namespace: sandbox-system
spec:
  replicas: 2
  selector:
    matchLabels: {app: sandbox-gateway}
  template:
    metadata:
      labels: {app: sandbox-gateway}
    spec:
      serviceAccountName: sandbox-gateway
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: gateway
        image: sandbox/api:IMAGE_TAG
        imagePullPolicy: IfNotPresent
        command: ["/gateway"]
        ports:
        - {name: ssh, containerPort: 2222}
        env:
        - name: POSTGRES_PASSWORD
          valueFrom: {secretKeyRef: {name: postgres-gateway-credentials, key: password}}
        - name: DATABASE_URL     # narrow role: SELECT on sandboxes; write ssh_activity only
          # pool_max_conns: lookups and activity writes share 10 connections
          # per replica, a fixed share of Postgres's 100 (D49).
          value: postgres://sandbox_gateway:$(POSTGRES_PASSWORD)@postgres.sandbox-system:5432/sandbox?sslmode=disable&pool_max_conns=10
        - {name: GATEWAY_LISTEN_ADDR, value: ":2222"}
        - {name: GATEWAY_HOST_KEY_FILE, value: /keys/host/ssh_host_ed25519_key}
        - {name: SANDBOX_INTERNAL_KEY_FILE, value: /keys/internal/id}
        # Connection limits per replica (D49): total; per client (IPv4 address
        # or IPv6 /64), only for connections still in their handshake (so
        # unauthenticated floods, not logged-in users behind one NAT); per
        # sandbox, logged-in connections.
        - {name: GATEWAY_MAX_CONNS, value: "1000"}
        - {name: GATEWAY_MAX_CONNS_PER_IP, value: "20"}
        - {name: GATEWAY_MAX_CONNS_PER_SANDBOX, value: "10"}
        # On rollout, keep accepting for 5 s after the pod is marked
        # terminating, while its endpoint is removed from the Services, so
        # no new connection is sent to a pod that already closed its
        # listener. (Existing sessions still end on SIGTERM, D35.)
        lifecycle:
          preStop: {sleep: {seconds: 5}}
        readinessProbe:
          tcpSocket: {port: ssh}
          periodSeconds: 5
        livenessProbe:
          tcpSocket: {port: ssh}
          periodSeconds: 10
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits:   {cpu: "1", memory: 256Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        volumeMounts:
        - {name: host-key, mountPath: /keys/host, readOnly: true}
        - {name: internal-key, mountPath: /keys/internal, readOnly: true}
      volumes:
      - name: host-key
        secret: {secretName: gateway-host-key, defaultMode: 0440}
      - name: internal-key
        secret: {secretName: sandbox-internal-key-private, defaultMode: 0440}
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-gateway
  namespace: sandbox-system
spec:
  selector: {app: sandbox-gateway}
  ports:
  - {name: ssh, port: 22, targetPort: ssh}
---
# Dev access from the Mac (step 3.6): the same gateway on a fixed port of the
# minikube node, so `ssh -p 30022 sb-…@$(minikube ip)` works without a
# port-forward. In a cloud this becomes a LoadBalancer on port 22 (Phase 6).
apiVersion: v1
kind: Service
metadata:
  name: sandbox-gateway-nodeport
  namespace: sandbox-system
spec:
  type: NodePort
  # Local: no SNAT, so the gateway sees (and logs) the client's real IP, not
  # the node's (Phase 3 batch review). Traffic only goes to gateway pods on
  # the node it arrived at; fine on one minikube node, and in a cloud the
  # LoadBalancer health-checks nodes so it only sends to ones with a pod.
  externalTrafficPolicy: Local
  selector: {app: sandbox-gateway}
  ports:
  - {name: ssh, port: 22, targetPort: ssh, nodePort: 30022}

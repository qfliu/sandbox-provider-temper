# Postgres for local development (D11). The Helm chart replaces this in
# Phase 6. Expects Secret `postgres-credentials` (created by
# code/scripts/deploy-postgres.sh, never committed).
apiVersion: v1
kind: Namespace
metadata:
  name: sandbox-system           # platform services; sandboxes live elsewhere (D24)
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: sandbox-system
spec:
  selector: {app: postgres}
  ports:
  - {name: postgres, port: 5432, targetPort: 5432}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: sandbox-system
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
      - name: postgres
        image: postgres:18.6
        ports:
        - {name: postgres, containerPort: 5432}
        env:
        - {name: POSTGRES_DB, value: sandbox}
        - name: POSTGRES_USER
          valueFrom: {secretKeyRef: {name: postgres-credentials, key: username}}
        - name: POSTGRES_PASSWORD
          valueFrom: {secretKeyRef: {name: postgres-credentials, key: password}}
        - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
        readinessProbe:
          exec: {command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d sandbox"]}
          periodSeconds: 3
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits:   {cpu: "1", memory: 1Gi}
        volumeMounts:
        - {name: data, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:          # data survives pod restarts (platform durability, D8)
  - metadata: {name: data}
    spec:
      accessModes: [ReadWriteOnce]
      resources:
        requests: {storage: 2Gi}

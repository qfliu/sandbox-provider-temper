# gVisor on cloud nodes (Phase 7, D54): the counterpart of
# code/scripts/install-gvisor.sh for nodes we can't ssh into (AKS). One
# privileged pod per node:
#   1. downloads the gVisor release inside the container, checks it against
#      the SHA-512 pinned below (not one fetched next to the download), and
#      unpacks it to the node's /opt/gvisor/<release>;
#   2. links runsc and its containerd shim into /usr/local/bin, writes
#      /etc/containerd/runsc.toml and runsc-docker.toml, and adds the runsc and
#      runsc-docker runtimes (D61) to containerd's config (containerd 1.x's
#      version 2 section names, or 2.x's for config versions 3 and 4). The edit
#      is made on a copy that containerd must accept (`config dump`) before it
#      replaces the real file, and if containerd isn't healthy after the
#      restart the old config is put back, so a bad edit can't leave a node
#      without a container runtime (there's no ssh into AKS nodes to fix one).
#      Running containers survive the restart; it can make the kubelet run this
#      init container once more, and the second run finds the config in place
#      ("already has ...");
#   3. idles on pause, so a new node gets the same treatment.
# Idempotent: a node that already has this release and config is left alone.
# To upgrade gVisor, change GVISOR_RELEASE and both SHA-512s in the pod
# template below: that rolls the DaemonSet, so every node reruns this.
# The same runsc settings as minikube: allow-suid for sudo inside sandboxes
# (D22), no oci-seccomp (breaks threads under gVisor, D45), raw sockets off.
# runsc-docker (RuntimeClass gvisor-docker, only for sandboxes that run
# Docker) also turns on raw sockets and packet-socket writes, which dockerd
# needs inside gVisor. They let the sandbox write any frame onto its pod's
# interface, so beyond the NetworkPolicies, Calico's anti-spoofing checks on
# workload interfaces are what drop forged source addresses (D61).
#
# Privileged with the host's PID namespace and /: it is node setup, like a
# cloud-init script, and lives in its own namespace that nothing else uses.
# Applied by code/scripts/cloud-up.sh before the Helm chart.
apiVersion: v1
kind: Namespace
metadata:
  name: gvisor-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gvisor-installer
  namespace: gvisor-system
data:
  fetch.sh: |
    # Runs in the container: download, verify, unpack into the node's /opt.
    set -eu
    REL=$GVISOR_RELEASE
    case "$(uname -m)" in
      aarch64) ARCH=aarch64 WANT=$SHA512_AARCH64 ;;
      x86_64) ARCH=x86_64 WANT=$SHA512_X86_64 ;;
      *) echo "unsupported arch" >&2; exit 1 ;;
    esac
    DEST=/host/opt/gvisor/$REL
    if [ -x "$DEST/runsc" ]; then echo "gVisor $REL already on the node"; exit 0; fi
    URL=https://storage.googleapis.com/gvisor/releases/release/$REL/$ARCH/gvisor.tar.bz2
    cd /tmp
    wget -q -O gvisor.tar.bz2 "$URL"
    [ "$(sha512sum gvisor.tar.bz2 | cut -d' ' -f1)" = "$WANT" ] ||
      { echo "checksum mismatch for $URL" >&2; exit 1; }
    rm -rf "$DEST" "$DEST.tmp"
    mkdir -p "$DEST.tmp"
    tar -xjf gvisor.tar.bz2 -C "$DEST.tmp"
    chmod 755 "$DEST.tmp/runsc" "$DEST.tmp/containerd-shim-runsc-v1" "$DEST.tmp"/gvisor-bin/*
    mv "$DEST.tmp" "$DEST"
    echo "gVisor $REL unpacked to /opt/gvisor/$REL"
  configure.sh: |
    # Runs on the node (nsenter into PID 1's namespaces).
    set -eu
    REL=$1
    mkdir -p /usr/local/bin
    ln -sf /opt/gvisor/$REL/runsc /usr/local/bin/runsc
    ln -sf /opt/gvisor/$REL/containerd-shim-runsc-v1 /usr/local/bin/containerd-shim-runsc-v1
    printf '[runsc_config]\n  allow-suid = "true"\n' >/etc/containerd/runsc.toml
    printf '[runsc_config]\n  allow-suid = "true"\n  net-raw = "true"\n  allow-packet-socket-write = "true"\n' \
      >/etc/containerd/runsc-docker.toml
    CONF=/etc/containerd/config.toml
    # Whether containerd's own parse of a config file (default: the live one)
    # yields both runtimes, runsc and runsc-docker. Not the file's text: AKS's
    # hybrid config kept an appended old-style runsc section that this parse
    # dropped, which is exactly the failure to catch. (It parses the file; it
    # doesn't ask the running daemon, hence the restart before the final check.)
    loaded() {
      dump=$(containerd ${1:+--config "$1"} config dump 2>/dev/null) || return 1
      for rt in runsc runsc-docker; do
        printf '%s\n' "$dump" | grep -Eq "runtimes\.[\"']?$rt[\"']?\]" || return 1
      done
    }
    if loaded; then
      echo "containerd already has the runsc and runsc-docker runtimes"
      exit 0
    fi
    # Start from the node's own config if an earlier run saved it, so a
    # section a previous attempt (or an older installer, with runsc only)
    # added is not carried along.
    BASE=$CONF
    [ -f "$CONF.before-gvisor" ] && BASE=$CONF.before-gvisor
    # The CRI plugin's section name: containerd 2.x's if the file already
    # uses it (AKS writes "version = 2" but 2.x names, which containerd
    # 2.x reads as is), or if it declares version 3 or 4; otherwise 1.x's.
    VER=$(sed -n 's/^version *= *\([0-9]*\).*/\1/p' "$BASE" | head -1)
    if grep -q 'io.containerd.cri.v1.runtime' "$BASE" || [ "${VER:-2}" -ge 3 ]; then
      CRI='plugins."io.containerd.cri.v1.runtime"'
    else
      CRI='plugins."io.containerd.grpc.v1.cri"'
    fi
    # Edit a copy, let containerd check it, then swap it in.
    cp "$BASE" "$CONF.gvisor-new"
    for rt in runsc runsc-docker; do
      printf '\n[%s.containerd.runtimes.%s]\n  runtime_type = "io.containerd.runsc.v1"\n[%s.containerd.runtimes.%s.options]\n  TypeUrl = "io.containerd.runsc.v1.options"\n  ConfigPath = "/etc/containerd/%s.toml"\n' \
        "$CRI" "$rt" "$CRI" "$rt" "$rt" >>"$CONF.gvisor-new"
    done
    if ! containerd --config "$CONF.gvisor-new" config dump >/dev/null 2>&1; then
      echo "containerd rejects the edited config; node left unchanged:" >&2
      containerd --config "$CONF.gvisor-new" config dump 2>&1 >/dev/null | tail -3 >&2
      rm -f "$CONF.gvisor-new"
      exit 1
    fi
    if ! loaded "$CONF.gvisor-new"; then
      echo "containerd would ignore the runsc sections ($CRI); node left unchanged" >&2
      rm -f "$CONF.gvisor-new"
      exit 1
    fi
    [ -f "$CONF.before-gvisor" ] || cp "$CONF" "$CONF.before-gvisor"
    # Roll back to the config the node was running, not to .before-gvisor:
    # on a node from the runsc-only installer that would take away a
    # working runsc (review of #72).
    cp "$CONF" "$CONF.gvisor-prev"
    mv "$CONF.gvisor-new" "$CONF"
    systemctl restart containerd
    sleep 3
    if ! systemctl is-active --quiet containerd || ! loaded; then
      echo "containerd isn't running with the runsc runtimes after the change; restoring the previous config" >&2
      cp "$CONF.gvisor-prev" "$CONF"
      systemctl restart containerd
      exit 1
    fi
    rm -f "$CONF.gvisor-prev"
    echo "containerd configured for runsc and runsc-docker (config version ${VER:-2}, $CRI) and restarted"
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gvisor-installer
  namespace: gvisor-system
  labels: {app: gvisor-installer}
spec:
  selector:
    matchLabels: {app: gvisor-installer}
  updateStrategy:
    type: RollingUpdate
    # On a template change, one node's containerd restarts at a time. (On
    # the first install every node starts at once; running containers
    # survive a containerd restart either way.)
    rollingUpdate: {maxUnavailable: 1}
  template:
    metadata:
      labels: {app: gvisor-installer}
      annotations:
        # The scripts live in the ConfigMap, whose changes don't restart
        # pods: bump this with any change to them so every node reruns.
        gvisor-installer/scripts: "2"   # 2: runsc-docker (D61)
    spec:
      hostPID: true
      automountServiceAccountToken: false
      priorityClassName: system-node-critical
      tolerations:
      - operator: Exists          # every node, including tainted ones
      initContainers:
      - name: fetch
        image: alpine:3.22@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
        command: ["sh", "/config/fetch.sh"]
        env: &release
        - {name: GVISOR_RELEASE, value: "20260928"}
        - {name: SHA512_AARCH64, value: "926538a4f20056d44838f230297ecec9192db2562e2523a207295f706b76126725f2ff7b4e59d747147510c5714057eeec862a0f77d43bf625746592b5f51b00"}
        - {name: SHA512_X86_64, value: "c8d3a9fd4d4c4f5b8ff213caa4517356be128d18659ec4cde37828fe797f61a9725a602a846c81a8ed19c057a996515d31c081eba343ed4613a89951ba32ed59"}
        # The ~100 MB download and its unpacked files count against the
        # memory limit (page cache), so fetch gets room; configure is small.
        resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {cpu: 1, memory: 1Gi}}
        volumeMounts:
        - {name: host-opt, mountPath: /host/opt}
        - {name: config, mountPath: /config}
      - name: configure
        image: alpine:3.22@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
        securityContext: {privileged: true}
        command: ["sh", "-c", "nsenter -t 1 -m -u -i -n -p -- sh -s \"$GVISOR_RELEASE\" < /config/configure.sh"]
        env: *release
        resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {cpu: 500m, memory: 128Mi}}
        volumeMounts:
        - {name: config, mountPath: /config}
      containers:
      - name: pause
        image: registry.k8s.io/pause:3.10.2@sha256:f548e0e8e3dc1896ca956272154dde3314e8cc4fde0a57577ee9fa1c63f5baf4
        resources: {requests: {cpu: 1m, memory: 8Mi}, limits: {cpu: 10m, memory: 16Mi}}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
      volumes:
      - name: host-opt
        hostPath: {path: /opt, type: DirectoryOrCreate}
      - name: config
        configMap: {name: gvisor-installer}
---
# Pods opt in with `runtimeClassName: gvisor`, or `gvisor-docker` for
# sandboxes that run Docker (sandbox pods always use one of them; the
# admission policy requires it). No scheduling constraint: a node added later
# could get a sandbox pod before its installer finishes; that pod fails to
# start ("no runtime for runsc") and is retried, never run without gVisor.
# cloud-up.sh waits for the DaemonSet before installing the platform.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor-docker
handler: runsc-docker

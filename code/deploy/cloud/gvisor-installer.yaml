# gVisor on cloud nodes (Phase 7, D54): the counterpart of
# code/scripts/install-gvisor.sh for nodes we can't ssh into (AKS). One
# privileged pod per node:
#   1. downloads the gVisor release (SHA-512 checked) inside the container
#      and copies it to the node's /opt/gvisor/<release>;
#   2. links runsc and its containerd shim into /usr/local/bin, writes
#      /etc/containerd/runsc.toml and adds the runsc runtime to containerd's
#      config (containerd 1.x's version 2 section names, or 2.x's for
#      config versions 3 and 4), then restarts containerd (running
#      containers keep running). That restart can make the kubelet run this
#      init container once more; the second run finds the config in place
#      and logs "already has the runsc runtime";
#   3. idles on pause, so a new node gets the same treatment.
# Idempotent: a node that already has this release and config is left alone.
# The same runsc settings as minikube: allow-suid for sudo inside sandboxes
# (D22), no oci-seccomp (breaks threads under gVisor, D45), raw sockets off.
#
# Privileged with the host's PID namespace and /: it is node setup, like a
# cloud-init script, and lives in its own namespace that nothing else uses.
# Applied by code/scripts/cloud-up.sh before the Helm chart.
apiVersion: v1
kind: Namespace
metadata:
  name: gvisor-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gvisor-installer
  namespace: gvisor-system
data:
  RELEASE: "20260928"
  fetch.sh: |
    # Runs in the container: download, verify, unpack into the node's /opt.
    set -eu
    REL=$(cat /config/RELEASE)
    case "$(uname -m)" in aarch64) ARCH=aarch64 ;; x86_64) ARCH=x86_64 ;; *) echo "unsupported arch" >&2; exit 1 ;; esac
    DEST=/host/opt/gvisor/$REL
    if [ -x "$DEST/runsc" ]; then echo "gVisor $REL already on the node"; exit 0; fi
    URL=https://storage.googleapis.com/gvisor/releases/release/$REL/$ARCH/gvisor.tar.bz2
    cd /tmp
    wget -q -O gvisor.tar.bz2 "$URL"
    wget -q -O gvisor.tar.bz2.sha512 "$URL.sha512"
    [ "$(sha512sum gvisor.tar.bz2 | cut -d' ' -f1)" = "$(cut -d' ' -f1 gvisor.tar.bz2.sha512)" ] ||
      { echo "checksum mismatch for $URL" >&2; exit 1; }
    mkdir -p "$DEST.tmp"
    tar -xjf gvisor.tar.bz2 -C "$DEST.tmp"
    chmod 755 "$DEST.tmp/runsc" "$DEST.tmp/containerd-shim-runsc-v1" "$DEST.tmp"/gvisor-bin/*
    mv "$DEST.tmp" "$DEST"
    echo "gVisor $REL unpacked to /opt/gvisor/$REL"
  configure.sh: |
    # Runs on the node (nsenter into PID 1's namespaces).
    set -eu
    REL=$1
    mkdir -p /usr/local/bin
    ln -sf /opt/gvisor/$REL/runsc /usr/local/bin/runsc
    ln -sf /opt/gvisor/$REL/containerd-shim-runsc-v1 /usr/local/bin/containerd-shim-runsc-v1
    printf '[runsc_config]\n  allow-suid = "true"\n' >/etc/containerd/runsc.toml
    CONF=/etc/containerd/config.toml
    # Config version 2 (containerd 1.x) names the CRI plugin differently from
    # versions 3 and 4 (containerd 2.x).
    VER=$(sed -n 's/^version *= *\([0-9]*\).*/\1/p' "$CONF" | head -1)
    if [ "${VER:-2}" -ge 3 ]; then
      CRI='plugins."io.containerd.cri.v1.runtime"'
    else
      CRI='plugins."io.containerd.grpc.v1.cri"'
    fi
    if grep -qF "[$CRI.containerd.runtimes.runsc.options]" "$CONF"; then
      echo "containerd already has the runsc runtime (config version ${VER:-2})"
      exit 0
    fi
    cp "$CONF" "$CONF.before-gvisor"
    printf '\n[%s.containerd.runtimes.runsc]\n  runtime_type = "io.containerd.runsc.v1"\n[%s.containerd.runtimes.runsc.options]\n  TypeUrl = "io.containerd.runsc.v1.options"\n  ConfigPath = "/etc/containerd/runsc.toml"\n' \
      "$CRI" "$CRI" >>"$CONF"
    systemctl restart containerd
    echo "containerd configured for runsc (config version ${VER:-2}, $CRI) and restarted"
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gvisor-installer
  namespace: gvisor-system
  labels: {app: gvisor-installer}
spec:
  selector:
    matchLabels: {app: gvisor-installer}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 1}   # one node's containerd restarts at a time
  template:
    metadata:
      labels: {app: gvisor-installer}
    spec:
      hostPID: true
      automountServiceAccountToken: false
      priorityClassName: system-node-critical
      tolerations:
      - operator: Exists          # every node, including tainted ones
      initContainers:
      - name: fetch
        image: alpine:3.22
        command: ["sh", "/config/fetch.sh"]
        volumeMounts:
        - {name: host-opt, mountPath: /host/opt}
        - {name: config, mountPath: /config}
      - name: configure
        image: alpine:3.22
        securityContext: {privileged: true}
        command: ["sh", "-c", "nsenter -t 1 -m -u -i -n -p -- sh -s \"$(cat /config/RELEASE)\" < /config/configure.sh"]
        volumeMounts:
        - {name: config, mountPath: /config}
      containers:
      - name: pause
        image: registry.k8s.io/pause:3.10.2@sha256:f548e0e8e3dc1896ca956272154dde3314e8cc4fde0a57577ee9fa1c63f5baf4
        resources: {requests: {cpu: 1m, memory: 8Mi}, limits: {cpu: 10m, memory: 16Mi}}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
      volumes:
      - name: host-opt
        hostPath: {path: /opt, type: DirectoryOrCreate}
      - name: config
        configMap: {name: gvisor-installer}
---
# Pods opt in with `runtimeClassName: gvisor` (sandbox pods always do; the
# admission policy requires it).
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc

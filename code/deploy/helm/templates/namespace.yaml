# Sandbox pods (untrusted code) live in their own namespace (D24, D26).
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.sandboxNamespace }}
  labels:
    {{- include "sp.labels" . | nindent 4 }}
    # Pod Security Admission can't enforce `baseline` here any more: Docker
    # sandboxes (runtimeClassName gvisor-docker) need SYS_ADMIN, NET_ADMIN and
    # NET_RAW, which only gVisor contains (D61). sandbox-pod-policy.yaml
    # enforces gVisor and least privilege per runtime, and repeats baseline's
    # host rules (no host namespaces, hostPath, host ports, ...), for every
    # client. `privileged` is set explicitly so a cluster-wide default can't
    # silently reject Docker sandboxes.
    pod-security.kubernetes.io/enforce: privileged

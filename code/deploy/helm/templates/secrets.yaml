{{- /*
Credentials and keys, generated on first install and then kept: never
committed, never in values. "keep" leaves them in place on uninstall, so a
reinstall still matches the data on Postgres's volume (which uninstall
also keeps). To wipe everything: kubectl delete namespace <this namespace>.
*/ -}}
{{- $ns := .Release.Namespace -}}
# Postgres superuser: only the db-setup Job uses it (D47).
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: {{ $ns }}
  labels: {{- include "sp.labels" . | nindent 4 }}
  annotations: {helm.sh/resource-policy: keep}
type: Opaque
data:
  username: {{ "sandbox" | b64enc }}
  password: {{ include "sp.keep" (dict "ns" $ns "name" "postgres-credentials" "key" "password" "new" (randAlphaNum 40)) }}
---
# sandbox_app: the API's role, owns the platform's tables, not a superuser.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-app-credentials
  namespace: {{ $ns }}
  labels: {{- include "sp.labels" . | nindent 4 }}
  annotations: {helm.sh/resource-policy: keep}
type: Opaque
data:
  password: {{ include "sp.keep" (dict "ns" $ns "name" "postgres-app-credentials" "key" "password" "new" (randAlphaNum 40)) }}
---
# sandbox_gateway: reads sandboxes, writes ssh_activity, nothing else (D36).
apiVersion: v1
kind: Secret
metadata:
  name: postgres-gateway-credentials
  namespace: {{ $ns }}
  labels: {{- include "sp.labels" . | nindent 4 }}
  annotations: {helm.sh/resource-policy: keep}
type: Opaque
data:
  password: {{ include "sp.keep" (dict "ns" $ns "name" "postgres-gateway-credentials" "key" "password" "new" (randAlphaNum 40)) }}
---
# The platform-internal SSH key (D7): the API and gateway log into sandboxes
# with it. The API publishes its public half to the sandboxes namespace at
# startup (Helm can't derive an OpenSSH public key).
apiVersion: v1
kind: Secret
metadata:
  name: sandbox-internal-key-private
  namespace: {{ $ns }}
  labels: {{- include "sp.labels" . | nindent 4 }}
  annotations: {helm.sh/resource-policy: keep}
type: Opaque
data:
  id: {{ include "sp.keep" (dict "ns" $ns "name" "sandbox-internal-key-private" "key" "id" "new" (genPrivateKey "ed25519")) }}
---
# The SSH gateway's own host key (D6): kept, so users' known_hosts entries
# stay valid across upgrades and replicas.
apiVersion: v1
kind: Secret
metadata:
  name: gateway-host-key
  namespace: {{ $ns }}
  labels: {{- include "sp.labels" . | nindent 4 }}
  annotations: {helm.sh/resource-policy: keep}
type: Opaque
data:
  ssh_host_ed25519_key: {{ include "sp.keep" (dict "ns" $ns "name" "gateway-host-key" "key" "ssh_host_ed25519_key" "new" (genPrivateKey "ed25519")) }}

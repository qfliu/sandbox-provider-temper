{{- define "sp.caddyfile" -}}
{{- $p := .Values.publicApi -}}
{
  admin off
  http_port 8080
  https_port 8443
  auto_https disable_redirects
  storage file_system /data/caddy
  {{- if eq $p.tls "internal" }}
  skip_install_trust
  {{- end }}
  {{- with $p.acmeEmail }}
  email {{ . }}
  {{- end }}
}
{{ $p.host }} {
  {{- if eq $p.tls "internal" }}
  tls internal
  {{- else }}
  tls {
    issuer acme {
      disable_http_challenge
    }
  }
  {{- end }}
  {{- with $p.allowedSourceRanges }}
  @denied not remote_ip {{ join " " . }}
  respond @denied "forbidden: this address isn't on the allowlist" 403
  {{- end }}
  reverse_proxy sandbox-api.{{ .Release.Namespace }}.svc.cluster.local:80
  log
}
{{- end }}
{{- if .Values.publicApi.enabled }}
{{- $p := .Values.publicApi }}
{{- $host := required "publicApi.host is required when publicApi.enabled (the DNS name clients use)" $p.host }}
{{- if not (has $p.tls (list "acme" "internal")) }}{{ fail "publicApi.tls must be acme or internal" }}{{ end }}
{{- range $p.allowedSourceRanges }}{{ if not (regexMatch "^[0-9a-fA-F:.]+/[0-9]{1,3}$" .) }}{{ fail (printf "publicApi.allowedSourceRanges: %q is not a CIDR" .) }}{{ end }}{{ end }}
# The API and dashboard on a public HTTPS address (step 7.6), for testers
# and agents outside the cluster: Caddy terminates TLS with a certificate it
# gets and renews itself (Let's Encrypt via the TLS-ALPN challenge on 443,
# so no port 80; or Caddy's own CA with tls: internal, for local testing)
# and proxies to the sandbox-api Service. Optional allowlist: requests from
# other addresses get 403. It's enforced here rather than on the load
# balancer so Let's Encrypt can still reach 443 to validate the
# certificate, and externalTrafficPolicy: Local lets Caddy see client IPs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: public-api
  namespace: {{ .Release.Namespace }}
  labels: {{- include "sp.labels" . | nindent 4 }}
data:
  Caddyfile: |
    {{- include "sp.caddyfile" . | nindent 4 }}
---
# Certificates and ACME account, kept across restarts so a restart doesn't
# request a new certificate (Let's Encrypt allows few per week per name).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: public-api-data
  namespace: {{ .Release.Namespace }}
  labels: {{- include "sp.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with $p.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests: {storage: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: public-api
  namespace: {{ .Release.Namespace }}
  labels: {{- include "sp.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: {type: Recreate}   # one writer of the certificate volume
  selector:
    matchLabels: {app: public-api}
  template:
    metadata:
      labels: {app: public-api}
      annotations:
        checksum/config: {{ include "sp.caddyfile" . | sha256sum | trunc 16 | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: caddy
        image: {{ $p.image }}
        args: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
        env:
        - {name: XDG_DATA_HOME, value: /data}
        - {name: XDG_CONFIG_HOME, value: /config}
        ports:
        - {name: https, containerPort: 8443}
        readinessProbe:
          tcpSocket: {port: https}
          periodSeconds: 5
        resources:
          requests: {cpu: 20m, memory: 32Mi}
          limits: {cpu: 500m, memory: 256Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          # The image's caddy binary carries the file capability
          # cap_net_bind_service; with every capability dropped the kernel
          # refuses to exec it ("operation not permitted"). It listens on
          # 8443/8080 regardless.
          capabilities: {drop: [ALL], add: [NET_BIND_SERVICE]}
        volumeMounts:
        - {name: config, mountPath: /etc/caddy, readOnly: true}
        - {name: data, mountPath: /data}
        - {name: caddy-config, mountPath: /config}
        - {name: tmp, mountPath: /tmp}
      volumes:
      - name: config
        configMap: {name: public-api}
      - name: data
        persistentVolumeClaim: {claimName: public-api-data}
      - name: caddy-config
        emptyDir: {}
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: public-api
  namespace: {{ .Release.Namespace }}
  labels: {{- include "sp.labels" . | nindent 4 }}
  {{- with $p.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $p.service.type }}
  {{- if eq $p.service.type "LoadBalancer" }}
  externalTrafficPolicy: Local
  {{- end }}
  selector: {app: public-api}
  ports:
  - {name: https, port: 443, targetPort: https}
{{- end }}

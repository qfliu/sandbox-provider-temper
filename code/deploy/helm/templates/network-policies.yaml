{{- if .Values.networkPolicies.enabled }}
{{- $sb := .Values.sandboxNamespace }}
# Network isolation (D18, D37); verified by code/scripts/test-network-policy.sh.
#
# Sandboxes run untrusted code. They may reach the internet (pip, npm, git)
# and DNS, and nothing else: not each other, the platform (API, gateway,
# Postgres), the Kubernetes API, node IPs, or the cloud metadata endpoint.
# Only the API and the gateway may connect to a sandbox, and only on port 22.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ $sb }}
  labels: {{- include "sp.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# Ingress: sshd, only from the platform's API and gateway pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ssh-from-platform
  namespace: {{ $sb }}
  labels: {{- include "sp.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: {{ .Release.Namespace }}}
      podSelector:
        matchExpressions:
        - {key: app, operator: In, values: {{ include "sp.platformApps" . }}}
    ports:
    - {protocol: TCP, port: 22}
---
# Egress: DNS (cluster DNS only) and the public internet. Private and
# link-local ranges are excluded, which covers the pod and service networks,
# the nodes, a cloud VPC, and the metadata endpoint, without knowing each
# cluster's exact CIDRs. A managed cluster's Kubernetes API often has a
# PUBLIC address (AKS, EKS): the `kubernetes` Service forwards there, so
# that address is excluded too (found on AKS, step 7.5).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dns-and-internet
  namespace: {{ $sb }}
  labels: {{- include "sp.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
  - to:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: kube-system}
      podSelector:
        matchLabels: {k8s-app: kube-dns}
    ports:
    - {protocol: UDP, port: 53}
    - {protocol: TCP, port: 53}
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except: {{- toYaml (concat .Values.networkPolicies.blockedRanges (.Values.networkPolicies.extraBlockedRanges | default list) (include "sp.publicAPIServer" . | fromYamlArray)) | nindent 8 }}
---
# Postgres only from the API, the gateway and the db-setup Job (defence in
# depth).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-from-platform
  namespace: {{ .Release.Namespace }}
  labels: {{- include "sp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app: postgres}
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - {key: app, operator: In, values: [sandbox-api, sandbox-gateway, sandbox-db-setup]}
    ports:
    - {protocol: TCP, port: 5432}
{{- end }}

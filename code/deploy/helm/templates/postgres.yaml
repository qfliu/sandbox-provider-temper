# Postgres for the platform's state (D8, D11): one replica, data on a
# persistent volume that survives restarts, upgrades and uninstall.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
  labels: {{- include "sp.labels" . | nindent 4 }}
spec:
  selector: {app: postgres}
  ports:
  - {name: postgres, port: 5432, targetPort: 5432}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
  labels: {{- include "sp.labels" . | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      automountServiceAccountToken: false
      containers:
      - name: postgres
        image: {{ .Values.postgres.image }}
        ports:
        - {name: postgres, containerPort: 5432}
        env:
        - {name: POSTGRES_DB, value: sandbox}
        - name: POSTGRES_USER
          valueFrom: {secretKeyRef: {name: postgres-credentials, key: username}}
        - name: POSTGRES_PASSWORD
          valueFrom: {secretKeyRef: {name: postgres-credentials, key: password}}
        - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
        readinessProbe:
          exec: {command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d sandbox"]}
          periodSeconds: 3
        resources: {{- toYaml .Values.postgres.resources | nindent 10 }}
        volumeMounts:
        - {name: data, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
  - metadata: {name: data}
    spec:
      accessModes: [ReadWriteOnce]
      {{- with .Values.postgres.storageClassName }}
      storageClassName: {{ . }}
      {{- end }}
      resources:
        requests: {storage: {{ .Values.postgres.storage }}}

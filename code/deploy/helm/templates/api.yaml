# The control plane API and dashboard (D30).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-api
  namespace: {{ .Release.Namespace }}
  labels: {{- include "sp.labels" . | nindent 4 }}
---
# Only what the API needs, and only in the sandboxes namespace: manage
# sandbox pods, their host-key Secrets and the published internal key.
# Nothing cluster-wide.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-api
  namespace: {{ .Values.sandboxNamespace }}
  labels: {{- include "sp.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: [pods]
  verbs: [get, list, watch, create, delete]
- apiGroups: [""]
  resources: [secrets]
  verbs: [get, list, create, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-api
  namespace: {{ .Values.sandboxNamespace }}
  labels: {{- include "sp.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: sandbox-api
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sandbox-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-api
  namespace: {{ .Release.Namespace }}
  labels: {{- include "sp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}   # stateless; migrations, status sync and quota are replica-safe
  selector:
    matchLabels: {app: sandbox-api}
  template:
    metadata:
      labels: {app: sandbox-api}
    spec:
      serviceAccountName: sandbox-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532          # lets the non-root user read the mounted key
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: api
        image: {{ include "sp.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - {name: http, containerPort: 8080}
        env:
        - name: POSTGRES_PASSWORD   # sandbox_app: owns the platform's tables, not a superuser (D47)
          valueFrom: {secretKeyRef: {name: postgres-app-credentials, key: password}}
        - name: DATABASE_URL     # $(VAR) expands the env var defined above
          value: postgres://sandbox_app:$(POSTGRES_PASSWORD)@postgres.{{ .Release.Namespace }}:5432/sandbox?sslmode=disable
        - {name: SANDBOX_INTERNAL_KEY_FILE, value: /keys/id}
        - {name: SANDBOX_NAMESPACE, value: {{ .Values.sandboxNamespace | quote }}}
        - {name: SANDBOX_IMAGE_REPO, value: {{ .Values.sandboxImages.repository | quote }}}
        - {name: SANDBOX_IMAGE_TAG, value: {{ .Values.sandboxImages.tag | quote }}}
        - {name: SSH_GATEWAY_ADDR, value: {{ .Values.api.sshGatewayAddr | quote }}}
        {{- with .Values.api.defaultTTL }}
        - {name: SANDBOX_DEFAULT_TTL, value: {{ . | quote }}}
        {{- end }}
        {{- with .Values.api.maxTTL }}
        - {name: SANDBOX_MAX_TTL, value: {{ . | quote }}}
        {{- end }}
        {{- with .Values.api.idleTimeout }}
        - {name: SANDBOX_IDLE_TIMEOUT, value: {{ . | quote }}}
        {{- end }}
        readinessProbe:
          httpGet: {path: /readyz, port: http}
          periodSeconds: 5
        livenessProbe:
          httpGet: {path: /healthz, port: http}
          periodSeconds: 10
        resources: {{- toYaml .Values.api.resources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        volumeMounts:
        - {name: internal-key, mountPath: /keys, readOnly: true}
      volumes:
      - name: internal-key
        secret:
          secretName: sandbox-internal-key-private
          defaultMode: 0440      # group-readable for fsGroup, nobody else
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-api
  namespace: {{ .Release.Namespace }}
  labels: {{- include "sp.labels" . | nindent 4 }}
spec:
  selector: {app: sandbox-api}
  ports:
  - {name: http, port: 80, targetPort: http}

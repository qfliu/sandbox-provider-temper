{{define "content"}}
<section class="card narrow">
  <h1>Sign in</h1>
  <p class="muted">Use one of your API keys. Your administrator gives you the first one.</p>
  {{with .Error}}<p class="error" role="alert">{{.}}</p>{{end}}
  <form method="post" action="/ui/login">
    <label for="api_key">API key</label>
    <input id="api_key" name="api_key" type="password" autocomplete="off" placeholder="sk_…" required autofocus>
    <button type="submit">Sign in</button>
  </form>
</section>
{{end}}
